name: pre-commit

on:
  pull_request:

jobs:
  pre-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Prepare dbt profile
        run: |
          mkdir -p ~/.dbt
          cat > ~/.dbt/profiles.yml <<'YAML'
          dbt_dwh:
            target: dev
            outputs:
              dev:
                type: postgres
                host: "{{ env_var('DBT_HOST', 'localhost') }}"
                user: "{{ env_var('DBT_USER', 'dbt') }}"
                password: "{{ env_var('DBT_PASSWORD', 'dbt') }}"
                port: "{{ env_var('DBT_PORT', '5432') | as_number }}"
                dbname: "{{ env_var('DBT_DBNAME', 'dbt') }}"
                schema: "{{ env_var('DBT_SCHEMA', 'public') }}"
                threads: 1
          YAML

      - name: Install dbt packages
        run: dbt deps
        working-directory: dbt_dwh

      - name: Run pre-commit
        run: pre-commit run --all-files
