repos:
  - repo: https://github.com/sqlfluff/sqlfluff
    rev: 3.0.7
    hooks:
      - id: sqlfluff-lint
        args: [--config, .sqlfluff]
        files: ^dbt_dwh/.*\.sql$
        additional_dependencies:
          - sqlfluff-templater-dbt
          - dbt-postgres
      - id: sqlfluff-fix
        args: [--config, .sqlfluff]
        files: ^dbt_dwh/.*\.sql$
        additional_dependencies:
          - sqlfluff-templater-dbt
          - dbt-postgres
