version: 1

sources:
  - name: raw
    description: 'Schema for raw data'
    schema: raw
    tags: ['raw']

    tables:
      - name: users
        description: 'Links specific managers to geographical regions, allowing analysis of sales performance by manager'
        columns:
          - name: region
            description: 'Manager region'
            tests:
              - not_null
          - name: manager
            description: 'Manager name'
            tests:
              - not_null

      - name: returns
        description: 'Returned orders and status of this return'
        columns:
          - name: order_id
            description: 'Unique Order ID for each Customer'
            tests:
              - not_null
          - name: status
            description: 'Return status'
            tests:
              - not_null

      - name: orders
        description: 'Customer orders with product, shipping, and sales details'
        columns:
          - name: row_id
            description: 'Unique ID for each row.'
            tests:
              - not_null
          - name: order_id
            description: 'Unique Order ID for each Customer.'
            tests:
              - not_null
          - name: order_date
            description: 'Order Date of the product.'
          - name: ship_date
            description: 'Shipping Date of the Product.'
          - name: ship_mode
            description: 'Shipping Mode specified by the Customer.'
          - name: order_priority
            description: '.'
          - name: product_container
            description: '.'
          - name: customer_name
            description: 'Name of the Customer.'
          - name: customer_segment
            description: 'The segment where the Customer belongs.'
          - name: zip_code
            description: 'Postal Code of every Customer.'
          - name: city
            description: 'City of residence of of the Customer.'
          - name: state
            description: 'State of residence of the Customer.'
          - name: region
            description: 'Region where the Customer belong.'
          - name: product_category
            description: 'Category of the product ordered.'
          - name: product_sub_category
            description: 'Sub-Category of the product ordered.'
          - name: product_name
            description: 'Name of the Product.'
          - name: unit_price
            description: ''
          - name: order_quantity
            description: 'Quantity of the Product.'
          - name: sales
            description: 'Sales of the Product.'
          - name: profit
            description: 'Profit/Loss incurred.'
          - name: discount
            description: 'Discount provided.'
          - name: shipping_cost
            description: ''
          - name: product_base_margin
            description: ''
