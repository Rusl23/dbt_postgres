version: 2

models:
  - name: stg_managers
    description: "{{ doc('stg_managers_desc') }}"
    data_tests:
      - row_count_match:
          arguments:
            compare_model: "{{ source('raw', 'users') }}"
    columns:
      - name: dwh_id
        description: "{{ doc('col_dwh_id_desc') }}"
        tests:
          - not_null
      - name: region
        description: 'Manager region'
      - name: manager_name
        description: 'Manager name'
      - name: etl_timestamp
        description: "{{ doc('col_etl_timestamp_desc') }}"
        tests:
          - not_null
