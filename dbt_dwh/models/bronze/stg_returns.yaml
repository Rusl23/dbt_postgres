version: 2

models:
  - name: stg_returns
    description: "{{ doc('stg_returns_desc') }}"
    data_tests:
      - row_count_match:
          arguments:
            compare_model: "{{ source('raw', 'returns') }}"
    columns:
      - name: dwh_id
        description: "{{ doc('col_dwh_id_desc') }}"
        tests:
          - not_null
      - name: order_id
        description: "{{ doc('col_order_id_desc') }}"
      - name: status
        description: 'Return status'
      - name: etl_timestamp
        description: "{{ doc('col_etl_timestamp_desc') }}"
        tests:
          - not_null
